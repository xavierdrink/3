<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Menu</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;

      display:flex;
      justify-content:center;
      align-items:center;

      background:url('background.jpg') center center/cover no-repeat;
      font-family:Arial, Helvetica, sans-serif;
    }

   

    /* Wrapper */
    .menu-wrapper{
      position:relative;
      z-index:2;

      display:flex;
      flex-direction:column;
      align-items:center;
      gap:50px;
    }

    /* Atas */
    .top-row{
      display:flex;
      gap:60px;
      justify-content:center;
      align-items:center;
    }

    /* Bawah zig-zag */
    .bottom-row{
      display:flex;
      gap:180px;
      justify-content:center;
      align-items:center;
    }

    /* Tombol besar */
    .story-btn{
      width:180px;
      cursor:pointer;

      transition:0.28s ease;

      filter:
        drop-shadow(0 0 15px rgba(255,255,255,0.35))
        drop-shadow(0 0 25px rgba(0,0,0,0.55));
    }

    .story-btn:hover{
      transform:scale(1.1) translateY(-10px);

      filter:
        drop-shadow(0 0 25px rgba(255,255,255,0.7))
        drop-shadow(0 0 35px rgba(0,255,255,0.55));
    }

    .story-btn:active{
      transform:scale(0.95);
    }

    /* Responsive */
    @media(max-width:1200px){

      .story-btn{
        width:220px;
      }

      .bottom-row{
        gap:100px;
      }
    }

    @media(max-width:768px){

      .top-row,
      .bottom-row{
        gap:25px;
        flex-wrap:wrap;
      }

      .story-btn{
        width:180px;
      }
    }
    /* Tombol Back Style Game */
    .back-btn{
      position:absolute;
      bottom:35px;
      left:50%;
      transform:translateX(-50%);

      z-index:5;

      padding:16px 55px;

      font-size:28px;
      font-weight:bold;
      color:white;

      border:none;
      border-radius:18px;

      cursor:pointer;

      background:
        linear-gradient(
          to bottom,
          #ff9f43 0%,
          #ff7b00 45%,
          #d95f00 100%
        );

      box-shadow:
        0 6px 0 #8a3a00,
        0 0 18px rgba(255,140,0,0.6),
        inset 0 4px 8px rgba(255,255,255,0.4);

      text-shadow:
        0 2px 5px rgba(0,0,0,0.4);

      transition:0.18s ease;
    }

    /* Efek glossy */
    .back-btn::before{
      content:"";
      position:absolute;

      top:6px;
      left:12px;

      width:75%;
      height:38%;

      border-radius:15px;

      background:rgba(255,255,255,0.35);

      filter:blur(1px);
    }

    .back-btn:hover{
      transform:
        translateX(-50%)
        scale(1.08);

      box-shadow:
        0 6px 0 #8a3a00,
        0 0 28px rgba(255,180,0,0.9),
        inset 0 4px 10px rgba(255,255,255,0.5);
    }

    .back-btn:active{
      transform:
        translateX(-50%)
        translateY(4px);

      box-shadow:
        0 2px 0 #8a3a00,
        0 0 15px rgba(255,140,0,0.5);
    }


  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="menu-wrapper">

    <!-- Atas -->
    <div class="top-row">

      <img
        src="1.png"
        class="story-btn"
        onclick="window.location.href='isi/1.html'"
        alt="1"
      >

      <img
        src="2.png"
        class="story-btn"
        onclick="window.location.href='isi/2.html'"
        alt="2"
      >

      <img
        src="3.png"
        class="story-btn"
        onclick="window.location.href='isi/3.html'"
        alt="3"
      >

    </div>

    <!-- Bawah -->
    <div class="bottom-row">

      <img
        src="4.png"
        class="story-btn"
        onclick="window.location.href='isi/4.html'"
        alt="4"
      >

      <img
        src="5.png"
        class="story-btn"
        onclick="window.location.href='isi/5.html'"
        alt="5"
      >

    </div>

  </div>
  <button
    class="back-btn"
    onclick="window.location.href='../main.html'">

    ⬅ Kembali

  </button>

</body>
</html>
